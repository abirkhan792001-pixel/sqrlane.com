<text x="120" y="114" font-family="Geist" font-size="15" font-weight="500" fill="#6B6B6B" letter-spacing="1.44">08 · WHO AM I</text>
<text x="93" y="196" font-family="Geist" font-size="66" font-weight="600" fill="#0A0A0A" letter-spacing="-2">Seen the gap. Built the product. Mapped the buyers.</text>
<text x="96" y="246" font-family="Geist" font-size="24" font-weight="400" fill="#6B6B6B">One founder. Every line on the right is already done.</text>
<rect x="96" y="282" width="1728" height="1" fill="#0A0A0A" fill-opacity="0.12"/>
</g>
