<rect x="128" y="496" width="456" height="1" fill="#0A0A0A" fill-opacity="0.1"/>
<text x="128" y="532" font-family="Geist" font-size="13" font-weight="500" fill="#6B6B6B" letter-spacing="1.44">EXPERIENCE</text>
<text x="128" y="568" font-family="Geist" font-size="19" font-weight="400" fill="#0A0A0A">Shaped the investment thesis of a $170M VC fund.</text>
<text x="128" y="604" font-family="Geist" font-size="19" font-weight="400" fill="#0A0A0A">Advised Fortune 500 CEOs on restructuring</text>
<text x="128" y="630" font-family="Geist" font-size="19" font-weight="400" fill="#0A0A0A">liabilities above $100M.</text>
