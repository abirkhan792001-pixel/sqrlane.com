<path d="M682.5 360.3l3 3 6-6.4" stroke="#0F7B3F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="710" y="365" font-family="Geist" font-size="13" font-weight="500" fill="#0A0A0A" letter-spacing="1.44">SEEN THE GAP</text>
<text x="936" y="370" font-family="Geist" font-size="28" font-weight="600" fill="#0A0A0A" letter-spacing="-0.5">Nobody owns the step between. That is my bet.</text>
<text x="936" y="404" font-family="Geist" font-size="19" font-weight="400" fill="#6B6B6B">Risk tools stop at the alert. Execution tools start after the decision.</text>
</g>
