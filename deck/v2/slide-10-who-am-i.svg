<circle cx="687" cy="599" r="11" fill="#E9F3EC"/>
<path d="M682.5 599.3l3 3 6-6.4" stroke="#0F7B3F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="710" y="604" font-family="Geist" font-size="13" font-weight="500" fill="#0A0A0A" letter-spacing="1.44">MAPPED THE BUYERS</text>
<text x="936" y="609" font-family="Geist" font-size="28" font-weight="600" fill="#0A0A0A" letter-spacing="-0.5">Mid-size forwarders in DACH and Benelux.</text>
<text x="936" y="643" font-family="Geist" font-size="19" font-weight="400" fill="#6B6B6B">An ICP list of forwarders, enriched in Apollo. Events lined up for outreach.</text>
<rect x="1698" y="586" width="90" height="30" rx="7" fill="#F6EEE3"/>
<text x="1709" y="606" font-family="Geist" font-size="14" font-weight="500" fill="#96580A">To confirm</text>
</g>
