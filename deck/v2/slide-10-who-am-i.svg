<text x="936" y="489" font-family="Geist" font-size="28" font-weight="600" fill="#0A0A0A" letter-spacing="-0.5">SQRlane runs today, end to end.</text>
<text x="936" y="523" font-family="Geist" font-size="19" font-weight="400" fill="#6B6B6B">16 agents, 60 live sources, any TMS by export or API. You approve every change.</text>
<rect x="1445" y="466" width="78" height="30" rx="7" fill="#E9F3EC"/>
<circle cx="1460" cy="481" r="4" fill="#0F7B3F"/>
