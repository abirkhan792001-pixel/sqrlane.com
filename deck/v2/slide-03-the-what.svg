<text x="1054" y="375" font-family="Geist" font-size="30" font-weight="600" fill="#0A0A0A" letter-spacing="-0.6">Nobody watches the lane.</text>
<text x="1008" y="414" font-family="Geist" font-size="17" font-weight="400" fill="#6B6B6B">The world moves every lane. Nothing reads it against your bookings.</text>
