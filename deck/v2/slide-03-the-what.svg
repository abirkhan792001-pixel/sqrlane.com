<text x="174" y="375" font-family="Geist" font-size="30" font-weight="600" fill="#0A0A0A" letter-spacing="-0.6">The desk re-types the same facts.</text>
<text x="128" y="414" font-family="Geist" font-size="17" font-weight="400" fill="#6B6B6B">One booking, typed out by hand into every system it touches.</text>
