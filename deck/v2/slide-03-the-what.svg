<text x="128" y="754" font-family="Geist" font-size="50" font-weight="600" fill="#0A0A0A" letter-spacing="-1.4">58%</text>
<text x="128" y="786" font-family="Geist" font-size="16" font-weight="500" fill="#0A0A0A">of the day on coordination</text>
<text x="128" y="810" font-family="Geist" font-size="14" font-weight="400" fill="#6B6B6B">chasing, searching, switching</text>
<text x="128" y="836" font-family="Geist" font-size="11.5" font-weight="500" fill="#6B6B6B" letter-spacing="0.18">Asana Anatomy of Work 2022</text>
<text x="536" y="754" font-family="Geist" font-size="50" font-weight="600" fill="#0A0A0A" letter-spacing="-1.4">€19,700</text>
<text x="536" y="786" font-family="Geist" font-size="16" font-weight="500" fill="#0A0A0A">per desk, per year</text>
<text x="536" y="810" font-family="Geist" font-size="14" font-weight="400" fill="#6B6B6B">€34k average salary × 58%</text>
<text x="536" y="836" font-family="Geist" font-size="11.5" font-weight="500" fill="#6B6B6B" letter-spacing="0.18">SalaryExpert 2025 · DE and NL</text>
