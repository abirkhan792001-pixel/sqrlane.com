<text x="120" y="114" font-family="Geist" font-size="15" font-weight="500" fill="#6B6B6B" letter-spacing="1.44">02 · THE WHAT</text>
<text x="93" y="196" font-family="Geist" font-size="66" font-weight="600" fill="#0A0A0A" letter-spacing="-2">Two problems. Each makes the other worse.</text>
<text x="96" y="246" font-family="Geist" font-size="24" font-weight="400" fill="#6B6B6B">Every hour spent re-typing is an hour nobody watches the lane.</text>
