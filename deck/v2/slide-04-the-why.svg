<text x="1638.0" y="646" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="middle">Zauber</text>
<rect x="1480" y="662" width="316" height="30" rx="8" fill="#EBEBEB" fill-opacity="0.7"/>
<text x="1638.0" y="682" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="middle">Nemox</text>
<rect x="1480" y="698" width="316" height="30" rx="8" fill="#EBEBEB" fill-opacity="0.7"/>
<text x="1638.0" y="718" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="middle">HappyRobot</text>
<rect x="1480" y="742" width="316" height="1" fill="#0A0A0A" fill-opacity="0.1"/>
<text x="1480" y="802" font-family="Geist" font-size="44" font-weight="600" fill="#0A0A0A" letter-spacing="-1.2">$96.7M</text>
<text x="1480" y="828" font-family="Geist" font-size="14" font-weight="400" fill="#6B6B6B">raised since Sept 2025</text>
<text x="1480" y="848" font-family="Geist" font-size="11.5" font-weight="400" fill="#6B6B6B">Augment $85M · Nexcade $8.5M · 5U AI $3.2M</text>
</g>
<g id="closing">
<text x="96" y="938" font-family="Geist" font-size="34" font-weight="600" fill="#0A0A0A" letter-spacing="-0.8">Anyone can alert. SQRlane decides, and puts it on the booking.</text>
<text x="1824" y="922" font-family="Geist" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="end">163,000 forwarding businesses in Europe. 24 of the top 25 run CargoWise.</text>
<text x="1824" y="940" font-family="Geist" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="end">IBISWorld 2025 · WiseTech Global FY25 · TAM derived, not measured.</text>
</g>
