<text x="1480" y="412" font-family="Geist" font-size="26" font-weight="600" fill="#0A0A0A" letter-spacing="-0.5">They act.</text>
<text x="1480" y="442" font-family="Geist" font-size="15" font-weight="400" fill="#6B6B6B">Only after you decide.</text>
<rect x="1480.0" y="468" width="73.0" height="6" rx="3" fill="#EBEBEB"/>
