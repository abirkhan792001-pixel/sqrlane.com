<path d="M101.5 1020h11 M101.5 1015h7.5 M101.5 1010h4" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<text x="130" y="1021" font-family="Geist" font-size="16" font-weight="600" fill="#0A0A0A">sqrlane</text>
<text x="200" y="1021" font-family="Geist" font-size="14" font-weight="400" fill="#6B6B6B">Automates the desk. Acts before the route breaks.</text>
<text x="1824" y="1021" font-family="Geist" font-size="12.5" font-weight="500" fill="#6B6B6B" text-anchor="end" letter-spacing="1.2">SLIDE 04</text>
