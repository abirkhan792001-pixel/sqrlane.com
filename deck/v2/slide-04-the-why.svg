<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect id="background" x="0" y="0" width="1920" height="1080" fill="#FAFAFA"/>
<g id="header">
<rect x="96" y="104" width="10" height="10" rx="2" fill="#96580A"/>
<text x="120" y="114" font-family="Geist" font-size="15" font-weight="500" fill="#6B6B6B" letter-spacing="1.44">03 · THE WHY</text>
<text x="93" y="196" font-family="Geist" font-size="66" font-weight="600" fill="#0A0A0A" letter-spacing="-2">€4bn a year of desk work. Nobody does all of it.</text>
<text x="96" y="246" font-family="Geist" font-size="24" font-weight="400" fill="#6B6B6B">Risk tools alert. Execution tools act. Neither decides.</text>
<rect x="96" y="282" width="1728" height="1" fill="#0A0A0A" fill-opacity="0.12"/>
</g>
<g id="where-the-4bn-sits">
<rect x="96" y="318" width="540" height="520" rx="14" fill="#FFFFFF" stroke="#0A0A0A" stroke-opacity="0.12"/>
<rect x="128" y="356" width="10" height="10" rx="2" fill="#0A0A0A"/>
<text x="152" y="366" font-family="Geist" font-size="13" font-weight="500" fill="#6B6B6B" letter-spacing="1.44">WHERE THE €4BN SITS</text>
<text x="278" y="436" font-family="Geist" font-size="26" font-weight="600" fill="#0A0A0A" text-anchor="end" letter-spacing="-0.5">1.6M</text>
<text x="298" y="436" font-family="Geist" font-size="15" font-weight="400" fill="#6B6B6B">people in European freight forwarding</text>
<rect x="128" y="458" width="476" height="1" fill="#0A0A0A" fill-opacity="0.06"/>
<text x="278" y="494" font-family="Geist" font-size="26" font-weight="600" fill="#96580A" text-anchor="end" letter-spacing="-0.5">÷ 5</text>
<text x="298" y="494" font-family="Geist" font-size="15" font-weight="400" fill="#6B6B6B">on an operating desk, assumed</text>
<rect x="128" y="516" width="476" height="1" fill="#0A0A0A" fill-opacity="0.06"/>
<text x="278" y="552" font-family="Geist" font-size="26" font-weight="600" fill="#0A0A0A" text-anchor="end" letter-spacing="-0.5">320,000</text>
<text x="298" y="552" font-family="Geist" font-size="15" font-weight="400" fill="#6B6B6B">operating desks</text>
<rect x="128" y="574" width="476" height="1" fill="#0A0A0A" fill-opacity="0.06"/>
<text x="278" y="610" font-family="Geist" font-size="26" font-weight="600" fill="#96580A" text-anchor="end" letter-spacing="-0.5">× €13,600</text>
<text x="298" y="610" font-family="Geist" font-size="15" font-weight="400" fill="#6B6B6B">admin cost per desk, per year</text>
<rect x="128" y="648" width="476" height="1" fill="#0A0A0A" fill-opacity="0.14"/>
<text x="278" y="720" font-family="Geist" font-size="26" font-weight="600" fill="#96580A" text-anchor="end">=</text>
<text x="298" y="730" font-family="Geist" font-size="64" font-weight="600" fill="#0A0A0A" letter-spacing="-2">€4.36bn</text>
<text x="300" y="764" font-family="Geist" font-size="16" font-weight="500" fill="#0A0A0A">a year spent on re-typing</text>
<text x="128" y="814" font-family="Geist" font-size="12" font-weight="400" fill="#6B6B6B">IBISWorld · SalaryExpert · UK staff per firm, scaled to 163,000 EU firms</text>
</g>
<g id="risk-platforms">
<rect x="660" y="318" width="372" height="520" rx="14" fill="#FFFFFF" stroke="#0A0A0A" stroke-opacity="0.12"/>
<text x="688" y="366" font-family="Geist" font-size="13" font-weight="600" fill="#6B6B6B" letter-spacing="1.4">RISK PLATFORMS</text>
<text x="688" y="412" font-family="Geist" font-size="26" font-weight="600" fill="#0A0A0A" letter-spacing="-0.5">They alert.</text>
<text x="688" y="442" font-family="Geist" font-size="15" font-weight="400" fill="#6B6B6B">The booking never changes.</text>
<rect x="688.0" y="468" width="73.0" height="6" rx="3" fill="#0A0A0A"/>
<text x="688.0" y="494" font-family="Geist" font-size="11" font-weight="600" fill="#0A0A0A" letter-spacing="0.8">WATCH</text>
<rect x="769.0" y="468" width="73.0" height="6" rx="3" fill="#EBEBEB"/>
<text x="769.0" y="494" font-family="Geist" font-size="11" font-weight="500" fill="#6B6B6B" letter-spacing="0.8">DECIDE</text>
<rect x="850.0" y="468" width="73.0" height="6" rx="3" fill="#EBEBEB"/>
<text x="850.0" y="494" font-family="Geist" font-size="11" font-weight="500" fill="#6B6B6B" letter-spacing="0.8">ACT</text>
<rect x="931.0" y="468" width="73.0" height="6" rx="3" fill="#EBEBEB"/>
<text x="931.0" y="494" font-family="Geist" font-size="11" font-weight="500" fill="#6B6B6B" letter-spacing="0.8">RECORD</text>
<rect x="688" y="518" width="316" height="30" rx="8" fill="#EBEBEB" fill-opacity="0.7"/>
<text x="846.0" y="538" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="middle">Everstream</text>
<rect x="688" y="556" width="316" height="30" rx="8" fill="#EBEBEB" fill-opacity="0.7"/>
<text x="846.0" y="576" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="middle">Interos</text>
<rect x="688" y="594" width="316" height="30" rx="8" fill="#EBEBEB" fill-opacity="0.7"/>
<text x="846.0" y="614" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="middle">Resilinc</text>
<rect x="688" y="746" width="316" height="1" fill="#0A0A0A" fill-opacity="0.1"/>
<text x="688" y="788" font-family="Geist" font-size="38" font-weight="600" fill="#0A0A0A" letter-spacing="-1">$1bn</text>
<text x="688" y="812" font-family="Geist" font-size="14" font-weight="400" fill="#6B6B6B">Interos valuation, 2024</text>
</g>
<g id="the-seam">
<rect x="1056" y="318" width="372" height="520" rx="14" fill="#96580A" fill-opacity="0.06" stroke="#96580A" stroke-opacity="0.45"/>
<text x="1084" y="366" font-family="Geist" font-size="13" font-weight="600" fill="#96580A" letter-spacing="1.4">THE SEAM</text>
<text x="1084" y="412" font-family="Geist" font-size="40" font-weight="600" fill="#0A0A0A" letter-spacing="-1">Decide.</text>
<text x="1084" y="442" font-family="Geist" font-size="15" font-weight="400" fill="#96580A">Nobody owns this step.</text>
<rect x="1084.0" y="468" width="73.0" height="6" rx="3" fill="#96580A"/>
<text x="1084.0" y="494" font-family="Geist" font-size="11" font-weight="600" fill="#96580A" letter-spacing="0.8">WATCH</text>
<rect x="1165.0" y="468" width="73.0" height="6" rx="3" fill="#96580A"/>
<text x="1165.0" y="494" font-family="Geist" font-size="11" font-weight="600" fill="#96580A" letter-spacing="0.8">DECIDE</text>
<rect x="1246.0" y="468" width="73.0" height="6" rx="3" fill="#96580A"/>
<text x="1246.0" y="494" font-family="Geist" font-size="11" font-weight="600" fill="#96580A" letter-spacing="0.8">ACT</text>
<rect x="1327.0" y="468" width="73.0" height="6" rx="3" fill="#96580A"/>
<text x="1327.0" y="494" font-family="Geist" font-size="11" font-weight="600" fill="#96580A" letter-spacing="0.8">RECORD</text>
<text x="1084" y="554" font-family="Geist" font-size="21" font-weight="600" fill="#0A0A0A">One loop, one record.</text>
<text x="1084" y="584" font-family="Geist" font-size="15" font-weight="400" fill="#6B6B6B">Watch and act are sold.</text>
<text x="1084" y="606" font-family="Geist" font-size="15" font-weight="400" fill="#6B6B6B">The step between is not.</text>
<rect x="1084" y="746" width="316" height="1" fill="#0A0A0A" fill-opacity="0.12"/>
<rect x="1084" y="770" width="28" height="28" rx="7" fill="#0A0A0A"/>
<path d="M1091 791h14 M1091 784h9.5 M1091 777h5" stroke="#FAFAFA" stroke-width="2.2" stroke-linecap="round" fill="none"/>
<text x="1124" y="791" font-family="Geist" font-size="20" font-weight="600" fill="#0A0A0A">sqrlane</text>
<text x="1084" y="824" font-family="Geist" font-size="14" font-weight="500" fill="#96580A">Owns the decision, end to end.</text>
</g>
<g id="execution-ai">
