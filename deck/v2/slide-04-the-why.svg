<rect x="1480" y="554" width="316" height="30" rx="8" fill="#EBEBEB" fill-opacity="0.7"/>
<text x="1638.0" y="574" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="middle">Augment</text>
<rect x="1480" y="590" width="316" height="30" rx="8" fill="#EBEBEB" fill-opacity="0.7"/>
