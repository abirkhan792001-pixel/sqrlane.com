<text x="1480" y="366" font-family="Geist" font-size="13" font-weight="600" fill="#6B6B6B" letter-spacing="1.4">EXECUTION AI</text>
<text x="1480" y="412" font-family="Geist" font-size="26" font-weight="600" fill="#0A0A0A" letter-spacing="-0.5">They act.</text>
<text x="1480" y="442" font-family="Geist" font-size="15" font-weight="400" fill="#6B6B6B">Only after you decide.</text>
<rect x="1480.0" y="468" width="73.0" height="6" rx="3" fill="#EBEBEB"/>
<text x="1480.0" y="494" font-family="Geist" font-size="11" font-weight="500" fill="#6B6B6B" letter-spacing="0.8">WATCH</text>
<rect x="1561.0" y="468" width="73.0" height="6" rx="3" fill="#EBEBEB"/>
<text x="1561.0" y="494" font-family="Geist" font-size="11" font-weight="500" fill="#6B6B6B" letter-spacing="0.8">DECIDE</text>
<rect x="1642.0" y="468" width="73.0" height="6" rx="3" fill="#0A0A0A"/>
<text x="1642.0" y="494" font-family="Geist" font-size="11" font-weight="600" fill="#0A0A0A" letter-spacing="0.8">ACT</text>
<rect x="1723.0" y="468" width="73.0" height="6" rx="3" fill="#0A0A0A"/>
<text x="1723.0" y="494" font-family="Geist" font-size="11" font-weight="600" fill="#0A0A0A" letter-spacing="0.8">RECORD</text>
<rect x="1480" y="518" width="316" height="30" rx="8" fill="#EBEBEB" fill-opacity="0.7"/>
<text x="1638.0" y="538" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="middle">5U AI</text>
<rect x="1480" y="556" width="316" height="30" rx="8" fill="#EBEBEB" fill-opacity="0.7"/>
<text x="1638.0" y="576" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="middle">Augment</text>
<rect x="1480" y="594" width="316" height="30" rx="8" fill="#EBEBEB" fill-opacity="0.7"/>
<text x="1638.0" y="614" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="middle">Nexcade</text>
<rect x="1480" y="632" width="316" height="30" rx="8" fill="#EBEBEB" fill-opacity="0.7"/>
<text x="1638.0" y="652" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="middle">Zauber</text>
<text x="1480" y="688" font-family="Geist" font-size="11" font-weight="600" fill="#6B6B6B" letter-spacing="1.2">ADJACENT</text>
<rect x="1480.0" y="698" width="154.0" height="30" rx="8" fill="#FFFFFF" stroke="#0A0A0A" stroke-opacity="0.14" stroke-dasharray="4 4"/>
<text x="1557.0" y="718" font-family="Geist" font-size="14" font-weight="500" fill="#6B6B6B" text-anchor="middle">Nemox</text>
<rect x="1642.0" y="698" width="154.0" height="30" rx="8" fill="#FFFFFF" stroke="#0A0A0A" stroke-opacity="0.14" stroke-dasharray="4 4"/>
<text x="1719.0" y="718" font-family="Geist" font-size="14" font-weight="500" fill="#6B6B6B" text-anchor="middle">HappyRobot</text>
<rect x="1480" y="746" width="316" height="1" fill="#0A0A0A" fill-opacity="0.1"/>
<text x="1480" y="788" font-family="Geist" font-size="38" font-weight="600" fill="#0A0A0A" letter-spacing="-1">$96.7M</text>
<text x="1480" y="812" font-family="Geist" font-size="14" font-weight="400" fill="#6B6B6B">raised since Sept 2025</text>
<text x="1480" y="830" font-family="Geist" font-size="11.5" font-weight="400" fill="#6B6B6B">Augment $85M · Nexcade $8.5M · 5U AI $3.2M</text>
</g>
<g id="closing">
<text x="96" y="912" font-family="Geist" font-size="34" font-weight="600" fill="#0A0A0A" letter-spacing="-0.8">Anyone can alert. SQRlane decides, and puts it on the booking.</text>
<text x="1824" y="900" font-family="Geist" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="end">163,000 forwarding businesses in Europe. 24 of the top 25 run CargoWise.</text>
<text x="1824" y="920" font-family="Geist" font-size="12.5" font-weight="400" fill="#6B6B6B" text-anchor="end">IBISWorld 2025 · WiseTech Global FY25 · TAM derived, not measured.</text>
</g>
<g id="footer">
<rect x="96" y="978" width="1728" height="1" fill="#0A0A0A" fill-opacity="0.12"/>
<rect x="96" y="1004" width="22" height="22" rx="6" fill="#0A0A0A"/>
<path d="M101.5 1020h11 M101.5 1015h7.5 M101.5 1010h4" stroke="#FAFAFA" stroke-width="1.8" stroke-linecap="round" fill="none"/>
<text x="130" y="1021" font-family="Geist" font-size="16" font-weight="600" fill="#0A0A0A">sqrlane</text>
<text x="200" y="1021" font-family="Geist" font-size="14" font-weight="400" fill="#6B6B6B">Automates the desk. Acts before the route breaks.</text>
<text x="1824" y="1021" font-family="Geist" font-size="12.5" font-weight="500" fill="#6B6B6B" text-anchor="end" letter-spacing="1.2">SLIDE 04</text>
</g>
