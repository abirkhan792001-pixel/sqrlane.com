<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <rect id="background" width="1920" height="1080" fill="#DBDBCD"/>

  <g id="top-bar">
    <g id="mark">
      <rect x="96" y="80" width="32" height="32" rx="8" fill="#0A0A0A"/>
      <path d="M104 104h16 M104 97h11 M104 90h6" stroke="#DBDBCD" stroke-width="2.4" stroke-linecap="round" fill="none"/>
    </g>
    <text id="site" x="144" y="103" font-family="Geist" font-size="20" font-weight="500" fill="#0A0A0A">sqrlane.com</text>
    <text id="deck-label" x="1824" y="103" font-family="Geist Mono" font-size="14" font-weight="500" letter-spacing="2.4" fill="#6E6E66" text-anchor="end">INVESTMENT DECK · 2026</text>
    <rect id="top-rule" x="96" y="144" width="1728" height="1" fill="#0A0A0A" fill-opacity="0.14"/>
  </g>

  <g id="hero">
    <g id="eyebrow">
      <rect x="96" y="360" width="10" height="10" rx="2" fill="#96580A"/>
      <text x="120" y="370" font-family="Geist Mono" font-size="16" font-weight="500" letter-spacing="3" fill="#6E6E66">AI WORKFORCE FOR FREIGHT FORWARDERS</text>
    </g>
    <text id="wordmark" x="88" y="590" font-family="Geist" font-size="240" font-weight="600" letter-spacing="-11" fill="#0A0A0A">sqrlane</text>
    <text id="tagline" x="96" y="746" font-family="Geist" font-size="48" font-weight="500" letter-spacing="-1.2" fill="#0A0A0A">Automates the desk. Acts before the route breaks.</text>
    <g id="subline">
      <text x="96" y="798" font-family="Geist" font-size="26" font-weight="400" fill="#6E6E66">An AI workforce that does the desk work end to end, from quote to invoice,</text>
      <text x="96" y="834" font-family="Geist" font-size="26" font-weight="400" fill="#6E6E66">and moves bookings before a disruption reaches the trade lane. You approve every change.</text>
    </g>
  </g>

  <g id="workforce-diagram">

    <g id="desk-track">
      <text id="desk-label" x="1060" y="244" font-family="Geist Mono" font-size="13" font-weight="500" letter-spacing="2.4" fill="#6E6E66">THE DESK · EVERY MAIL</text>
      <g id="mail-rate-request">
        <rect x="1060" y="264" width="176" height="32" rx="16" fill="#0A0A0A" fill-opacity="0.05" stroke="#0A0A0A" stroke-opacity="0.16"/>
        <circle cx="1078" cy="280" r="3" fill="#6E6E66"/>
        <text x="1090" y="285" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A">Rate request</text>
      </g>
      <g id="mail-booking">
        <rect x="1060" y="304" width="176" height="32" rx="16" fill="#0A0A0A" fill-opacity="0.05" stroke="#0A0A0A" stroke-opacity="0.16"/>
        <circle cx="1078" cy="320" r="3" fill="#6E6E66"/>
        <text x="1090" y="325" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A">Booking request</text>
      </g>
      <g id="mail-bill-of-lading">
        <rect x="1060" y="344" width="176" height="32" rx="16" fill="#0A0A0A" fill-opacity="0.05" stroke="#0A0A0A" stroke-opacity="0.16"/>
        <circle cx="1078" cy="360" r="3" fill="#6E6E66"/>
        <text x="1090" y="365" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A">Bill of lading</text>
      </g>
      <g id="mail-invoice">
        <rect x="1060" y="384" width="176" height="32" rx="16" fill="#0A0A0A" fill-opacity="0.05" stroke="#0A0A0A" stroke-opacity="0.16"/>
        <circle cx="1078" cy="400" r="3" fill="#6E6E66"/>
        <text x="1090" y="405" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A">Carrier invoice</text>
      </g>
      <g id="desk-converge">
        <path d="M1236 280 C1296 280 1300 340 1352 340" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" fill="none"/>
        <path d="M1236 320 C1290 320 1300 340 1352 340" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" fill="none"/>
        <path d="M1236 360 C1290 360 1300 340 1352 340" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" fill="none"/>
        <path d="M1236 400 C1296 400 1300 340 1352 340" stroke="#0A0A0A" stroke-opacity="0.45" stroke-width="1.5" fill="none"/>
      </g>
      <g id="desk-agents">
        <rect x="1352" y="320" width="40" height="40" rx="10" fill="#0A0A0A"/>
        <path d="M1362 348h20 M1362 340h13 M1362 332h7" stroke="#DBDBCD" stroke-width="2.6" stroke-linecap="round" fill="none"/>
        <text x="1372" y="384" font-family="Geist Mono" font-size="12" font-weight="500" letter-spacing="1.2" fill="#6E6E66" text-anchor="middle">AGENTS</text>
      </g>
      <g id="desk-to-record">
        <path d="M1392 340 H1552" stroke="#0A0A0A" stroke-width="2" fill="none"/>
        <path d="M1552 334 L1562 340 L1552 346 Z" fill="#0A0A0A"/>
      </g>
    </g>

    <g id="lane-track">
      <text id="lane-label" x="1060" y="500" font-family="Geist Mono" font-size="13" font-weight="500" letter-spacing="2.4" fill="#6E6E66">THE LANE · EVERY DISRUPTION</text>
      <path id="lane-leg-blocked" d="M1306 560 C1360 560 1380 628 1440 628" stroke="#6E6E66" stroke-width="2.5" stroke-dasharray="7 8" fill="none" stroke-linecap="round"/>
      <path id="lane-leg-sea" d="M1066 560 H1440" stroke="#0A0A0A" stroke-width="2.5" fill="none" stroke-linecap="round"/>
      <g id="node-sha">
        <circle cx="1066" cy="560" r="8" fill="#DBDBCD" stroke="#0A0A0A" stroke-width="2.5"/>
        <text x="1066" y="596" font-family="Geist Mono" font-size="14" font-weight="500" letter-spacing="1.5" fill="#0A0A0A" text-anchor="middle">SHA</text>
      </g>
      <g id="node-suez">
        <circle cx="1190" cy="560" r="8" fill="#DBDBCD" stroke="#0A0A0A" stroke-width="2.5"/>
        <text x="1190" y="596" font-family="Geist Mono" font-size="14" font-weight="500" letter-spacing="1.5" fill="#0A0A0A" text-anchor="middle">SUEZ</text>
      </g>
      <g id="node-ham">
        <circle cx="1440" cy="628" r="22" fill="#96580A" fill-opacity="0.14"/>
        <circle cx="1440" cy="628" r="8" fill="#96580A"/>
        <text x="1474" y="624" font-family="Geist Mono" font-size="14" font-weight="500" letter-spacing="1.5" fill="#0A0A0A">HAM</text>
        <text x="1474" y="642" font-family="Geist Mono" font-size="12" font-weight="500" letter-spacing="1.2" fill="#96580A">STRIKE</text>
      </g>
      <g id="node-rtm">
        <circle cx="1440" cy="560" r="8" fill="#0A0A0A"/>
        <text x="1440" y="538" font-family="Geist Mono" font-size="14" font-weight="500" letter-spacing="1.5" fill="#0A0A0A" text-anchor="middle">RTM</text>
      </g>
      <g id="lane-to-record">
        <path d="M1448 560 H1552" stroke="#0A0A0A" stroke-width="2" fill="none"/>
        <path d="M1552 554 L1562 560 L1552 566 Z" fill="#0A0A0A"/>
      </g>
    </g>

    <g id="tms-record">
      <rect x="1564" y="264" width="260" height="382" rx="14" fill="#F4F4EC" stroke="#0A0A0A" stroke-opacity="0.16"/>
      <text x="1588" y="302" font-family="Geist Mono" font-size="15" font-weight="600" letter-spacing="0.6" fill="#0A0A0A">SHP-001</text>
      <text x="1800" y="302" font-family="Geist Mono" font-size="12" font-weight="500" letter-spacing="1.8" fill="#6E6E66" text-anchor="end">TMS RECORD</text>
      <rect x="1588" y="320" width="212" height="1" fill="#0A0A0A" fill-opacity="0.12"/>
      <g id="field-quote">
        <text x="1588" y="356" font-family="Geist" font-size="14" font-weight="400" fill="#6E6E66">Quote</text>
        <text x="1800" y="356" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="end">on file</text>
      </g>
      <g id="field-bl">
        <text x="1588" y="394" font-family="Geist" font-size="14" font-weight="400" fill="#6E6E66">B/L fields</text>
        <text x="1800" y="394" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="end">read</text>
      </g>
      <g id="field-invoice">
        <text x="1588" y="432" font-family="Geist" font-size="14" font-weight="400" fill="#6E6E66">Invoice</text>
        <text x="1800" y="432" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="end">reconciled</text>
      </g>
      <g id="field-discharge">
        <text x="1588" y="470" font-family="Geist" font-size="14" font-weight="400" fill="#6E6E66">Discharge</text>
        <text x="1800" y="470" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="end">HAM → RTM</text>
      </g>
      <g id="field-eta">
        <text x="1588" y="508" font-family="Geist" font-size="14" font-weight="400" fill="#6E6E66">ETA</text>
        <text x="1800" y="508" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="end">+2 days</text>
      </g>
      <g id="field-comms">
        <text x="1588" y="546" font-family="Geist" font-size="14" font-weight="400" fill="#6E6E66">Carrier mail</text>
        <text x="1800" y="546" font-family="Geist" font-size="14" font-weight="500" fill="#0A0A0A" text-anchor="end">drafted</text>
      </g>
      <rect x="1588" y="584" width="212" height="1" fill="#0A0A0A" fill-opacity="0.12"/>
      <g id="approval-gate">
        <rect x="1588" y="600" width="212" height="30" rx="15" fill="#96580A" fill-opacity="0.12"/>
        <circle cx="1604" cy="615" r="4" fill="#96580A"/>
        <text x="1616" y="619" font-family="Geist Mono" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#96580A">QUEUED · AWAITING YOU</text>
      </g>
    </g>
  </g>

  <g id="bottom-bar">
    <rect id="bottom-rule" x="96" y="928" width="1728" height="1" fill="#0A0A0A" fill-opacity="0.14"/>
    <g id="founder">
      <text x="96" y="982" font-family="Geist" font-size="22" font-weight="600" fill="#0A0A0A">Abir Khan</text>
      <text x="96" y="1012" font-family="Geist" font-size="16" font-weight="400" fill="#6E6E66">Founder</text>
    </g>
    <g id="one-workforce">
      <text x="1060" y="982" font-family="Geist Mono" font-size="13" font-weight="500" letter-spacing="2.4" fill="#6E6E66">ONE WORKFORCE</text>
      <text x="1060" y="1012" font-family="Geist" font-size="18" font-weight="500" fill="#0A0A0A">The desk  +  the lane  →  one TMS record</text>
    </g>
    <g id="contact">
      <text x="1824" y="982" font-family="Geist" font-size="18" font-weight="500" fill="#0A0A0A" text-anchor="end">khan.abirhilal@gmail.com</text>
      <text x="1824" y="1012" font-family="Geist" font-size="16" font-weight="400" fill="#6E6E66" text-anchor="end">+91 7596947806</text>
    </g>
  </g>
</svg>
