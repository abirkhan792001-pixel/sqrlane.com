<text x="150" y="888" font-family="Geist" font-size="15" font-weight="400" fill="#0A0A0A">The documents on file</text>
<text x="458" y="812" font-family="Geist" font-size="12" font-weight="600" fill="#96580A" letter-spacing="1.2">IT DOES NOT</text>
<path d="M459 828 l9 9 M468 828 l-9 9" stroke="#96580A" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="480" y="840" font-family="Geist" font-size="15" font-weight="400" fill="#0A0A0A">Watch anything</text>
<path d="M459 852 l9 9 M468 852 l-9 9" stroke="#96580A" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="480" y="864" font-family="Geist" font-size="15" font-weight="400" fill="#0A0A0A">Decide anything</text>
<path d="M459 876 l9 9 M468 876 l-9 9" stroke="#96580A" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="480" y="888" font-family="Geist" font-size="15" font-weight="400" fill="#0A0A0A">Type itself</text>
<path d="M434 798 L434 896" stroke="#0A0A0A" stroke-opacity="0.1" stroke-width="1" fill="none"/>
<rect x="128" y="910" width="636" height="1" fill="#0A0A0A" fill-opacity="0.08"/>
<text x="128" y="936" font-family="Geist" font-size="16" font-weight="600" fill="#0A0A0A">The TMS is the record. The desk types into it.</text>
</g>
