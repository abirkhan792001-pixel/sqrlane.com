<text x="150" y="888" font-family="Geist" font-size="15" font-weight="400" fill="#0A0A0A">The documents on file</text>
<text x="458" y="812" font-family="Geist" font-size="12" font-weight="600" fill="#96580A" letter-spacing="1.2">IT DOES NOT</text>
<path d="M459 828 l9 9 M468 828 l-9 9" stroke="#96580A" stroke-width="2" fill="none" stroke-linecap="round"/>
<text x="480" y="840" font-family="Geist" font-size="15" font-weight="400" fill="#0A0A0A">Watch anything</text>
