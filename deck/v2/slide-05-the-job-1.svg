<g id="where-the-tms-sits">
<rect x="96" y="742" width="700" height="212" rx="14" fill="#FFFFFF" stroke="#0A0A0A" stroke-opacity="0.12"/>
<text x="128" y="782" font-family="Geist" font-size="13" font-weight="600" fill="#6B6B6B" letter-spacing="1.4">WHERE THE TMS SITS</text>
