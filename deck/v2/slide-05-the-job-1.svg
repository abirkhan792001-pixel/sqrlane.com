<rect x="128" y="910" width="636" height="1" fill="#0A0A0A" fill-opacity="0.08"/>
<text x="128" y="936" font-family="Geist" font-size="16" font-weight="600" fill="#0A0A0A">The TMS is the record. The desk types into it.</text>
</g>
