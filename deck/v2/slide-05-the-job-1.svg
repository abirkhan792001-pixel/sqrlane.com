<path d="M128 835 l4 4 l8 -9" stroke="#0F7B3F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="150" y="840" font-family="Geist" font-size="15" font-weight="400" fill="#0A0A0A">The booking and its dates</text>
<path d="M128 859 l4 4 l8 -9" stroke="#0F7B3F" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<text x="150" y="864" font-family="Geist" font-size="15" font-weight="400" fill="#0A0A0A">The rate that was agreed</text>
