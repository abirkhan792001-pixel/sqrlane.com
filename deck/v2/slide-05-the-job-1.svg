<text x="480" y="864" font-family="Geist" font-size="15" font-weight="400" fill="#0A0A0A">Decide anything</text>
<path d="M459 876 l9 9 M468 876 l-9 9" stroke="#96580A" stroke-width="2" fill="none" stroke-linecap="round"/>
