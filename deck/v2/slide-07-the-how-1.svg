<g id="tile-1">
<rect x="96.0" y="730" width="560.0" height="136" rx="14" fill="#FFFFFF" stroke="#0A0A0A" stroke-opacity="0.12"/>
<text x="124.0" y="774" font-family="Geist" font-size="21" font-weight="600" fill="#0A0A0A" letter-spacing="-0.3">Checked before it goes out</text>
<text x="124.0" y="808" font-family="Geist" font-size="14.5" font-weight="400" fill="#6B6B6B">The Playbook agent checks every output against</text>
<text x="124.0" y="830" font-family="Geist" font-size="14.5" font-weight="400" fill="#6B6B6B">the customer’s own rules, and sends back what breaks them.</text>
</g>
<g id="tile-2">
<rect x="680.0" y="730" width="560.0" height="136" rx="14" fill="#FFFFFF" stroke="#0A0A0A" stroke-opacity="0.12"/>
<text x="708.0" y="774" font-family="Geist" font-size="21" font-weight="600" fill="#0A0A0A" letter-spacing="-0.3">Correct it once. The desk learns.</text>
<text x="708.0" y="808" font-family="Geist" font-size="14.5" font-weight="400" fill="#6B6B6B">One correction becomes a rule, replays the inbox</text>
<text x="708.0" y="830" font-family="Geist" font-size="14.5" font-weight="400" fill="#6B6B6B">and fixes every mail like it. Nothing earlier is undone.</text>
</g>
<g id="tile-3">
<rect x="1264.0" y="730" width="560.0" height="136" rx="14" fill="#FFFFFF" stroke="#0A0A0A" stroke-opacity="0.12"/>
<text x="1292.0" y="774" font-family="Geist" font-size="21" font-weight="600" fill="#0A0A0A" letter-spacing="-0.3">Nothing leaves without you</text>
<text x="1292.0" y="808" font-family="Geist" font-size="14.5" font-weight="400" fill="#6B6B6B">Every draft and every TMS change waits for your</text>
<text x="1292.0" y="830" font-family="Geist" font-size="14.5" font-weight="400" fill="#6B6B6B">approval. Nothing is sent or written on its own.</text>
</g>
<text x="96" y="946" font-family="Geist" font-size="28" font-weight="600" fill="#0A0A0A" letter-spacing="-0.6">Every system on one screen. Every step recorded. You approve each change.</text>
<text x="1824" y="944" font-family="Geist" font-size="20" font-weight="600" fill="#96580A" text-anchor="end">Built for the 40%.</text>
